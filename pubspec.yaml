name: read_leaf
description: A new Flutter project.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.1.3 <4.0.0'

dependencies:
  # Flutter SDK
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # A
  app_links: ^6.4.0
  another_flushbar: ^1.12.29

  # B
  bloc: ^9.0.0
  bloc_concurrency: ^0.3.0

  # C
  cached_network_image: ^3.4.1
  connectivity_plus: ^6.1.2
  crypto: ^3.0.6
  cupertino_icons: ^1.0.8

  # D
  dio: ^5.7.0

  # E
  epubx: ^4.0.0
  equatable: ^2.0.7
  external_path: ^2.0.1

  # F
  file_picker: ^10.1.2
  flutter_bloc: ^9.0.0
  flutter_cache_manager: ^3.3.1
  flutter_downloader: ^1.11.8
  flutter_dotenv: ^5.2.1
  flutter_facebook_auth: ^7.1.1
  flutter_inappwebview: ^6.1.5
  flutter_octicons: ^1.47.0
  flutter_riverpod: ^2.6.1
  flutter_screenutil: ^5.9.1
  flutter_svg: ^2.0.16
  flutter_widget_from_html: ^0.16.0
  fluttericon: ^2.0.0
  freezed_annotation: ^3.0.0

  # G
  get_it: ^8.0.3
  go_router: ^15.1.1
  google_generative_ai: ^0.4.6
  google_nav_bar: ^5.0.7
  google_sign_in: ^6.2.2

  # H
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # I
  image: ^3.3.0
  image_cropper: ^9.0.0
  image_picker: ^1.1.2
  injectable: ^2.3.2
  intl: any
  intl_utils: ^2.7.0

  # J
  json_annotation: ^4.9.0

  # L
  logger: ^2.5.0
  logging: ^1.2.0

  # M
  material_design_icons_flutter: ^7.0.7296
  material_symbols_icons: ^4.2805.1

  # P
  path: ^1.9.0
  path_drawing: ^1.0.1
  path_provider: ^2.1.5
  pdfrx: ^1.0.101
  percent_indicator: ^4.2.4
  permission_handler: ^12.0.0+1
  persistent_bottom_nav_bar_v2: ^5.4.0
  pretty_dio_logger: ^1.3.1
  provider: ^6.1.2

  # R
  retrofit: ^4.1.0
  retrofit_generator: ^9.1.9
  rxdart: ^0.28.0

  # S
  screenshot: ^3.0.0
  scrollable_positioned_list: ^0.3.8
  sentry_flutter: ^8.14.2
  share_plus: ^11.0.0
  shared_preferences: ^2.3.3
  shimmer: ^3.0.0
  sign_in_with_apple: ^6.1.4
  sqflite: ^2.4.1
  supabase_auth_ui: ^0.5.4
  supabase_flutter: ^2.3.4
  syncfusion_flutter_pdfviewer: ^29.1.38

  # U
  url_launcher: ^6.2.4
  uuid: ^4.3.3

dev_dependencies:
  # Flutter SDK
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  build_runner: ^2.4.7
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.11.0
  freezed: ^3.0.0-0.0.dev
  hive_generator: ^2.0.1
  injectable_generator: ^2.3.2
  json_serializable: ^6.7.1
  mockito: ^5.4.4
  sentry_dart_plugin: ^2.4.1

dependency_overrides:
  collection: ^1.19.1

flutter:
  uses-material-design: true
  generate: true
  assets:
    # chat bg, app icon, etc.
    - assets/images/app_logo/logo.jpeg
    - assets/images/chat/chat_bg_pattern.png
    - assets/images/leafy_icon.png
    - assets/icons/
    - assets/images/app_logo/logo_nobg.png

    # default ai characters
    - lib/features/characters/data/default_characters.json
    - assets/images/ai_characters/
    - lib/features/characters/data/image_service.dart
    - lib/features/characters/data/personality_traits.json

    # default books
    - assets/pdfs/atomic_habits.pdf
    - assets/pdfs/app_development_flutter.pdf
    - assets/pdfs/business_law.pdf
    - assets/pdfs/gietconchimnhan.pdf
    - assets/document/
    - assets/epubs/
    
    # default books's thumbnails
    - assets/images/thumbnails/

    - .env

    # auth assets
    - assets/images/
    - assets/images/auth/
    - assets/images/auth/google_logo.png

  fonts:
    - family: Lato
      fonts:
        - asset: assets/fonts/Lato-Regular.ttf
        - asset: assets/fonts/Lato-Bold.ttf
          weight: 700
        - asset: assets/fonts/Lato-Italic.ttf
          style: italic
        - asset: assets/fonts/Lato-Light.ttf
          weight: 300
        - asset: assets/fonts/Lato-Thin.ttf
          weight: 100
        - asset: assets/fonts/Lato-Black.ttf
          weight: 900
        
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_logo/logo.jpeg"
  min_sdk_android: 21
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/images/app_logo/logo.jpeg"
  windows:
    generate: true
    image_path: "assets/images/app_logo/logo.jpeg"
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/images/app_logo/logo.jpeg"

sentry:
  upload_debug_symbols: true
  upload_source_maps: true
  project: flutter
  org: ngo-thanh-trung

# Configuration for intl auto generation
flutter_intl:
  enabled: true
